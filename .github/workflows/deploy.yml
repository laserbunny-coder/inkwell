name: Publish Inkwell

on:
  push:
    branches: [main]
    # The server (supabase/) has its own workflow, server.yml.
    paths-ignore: ['supabase/**', '.github/workflows/server.yml']
  # A pull request runs the same tests first; only main is published.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The tests are split in three and run on three machines at once.
    name: Test (${{ matrix.share }} of 3)
    # Pinned: ubuntu-latest became 26.04 in Nov 2026, which Playwright 1.56 can't install Chromium on.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        share: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install a browser for the tests
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install chromium
          # The runner already has what Chromium needs; the system packages
          # (a slow mirror once took four minutes) only come in if it won't start.
          node -e "require('playwright').chromium.launch().then(b => b.close())" \
            || npx playwright install-deps chromium
      - name: Connect to the Supabase project shared with Daybook
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          # Both values are public by design (row level security protects the data).
          # Set them as repository variables, or they're read from Daybook's published settings.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            cfg=$(curl -fsSL https://laserbunny-coder.github.io/daybook/js/config.js || true)
            SUPABASE_URL=$(printf '%s' "$cfg" | sed -n "s/.*supabaseUrl: *'\([^']*\)'.*/\1/p")
            SUPABASE_ANON_KEY=$(printf '%s' "$cfg" | sed -n "s/.*supabaseAnonKey: *'\([^']*\)'.*/\1/p")
          fi
          if [ -z "$SUPABASE_URL" ]; then echo "::warning::No Supabase settings found; publishing without sync."; fi
          printf "export default { supabaseUrl: '%s', supabaseAnonKey: '%s' };\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > src/config.js
      - name: Build
        run: npx vite build
      - name: Test
        run: node tests/all.mjs ${{ matrix.share }}/3
      # The first machine also packs up the site for publishing.
      - name: New cache name so phones pick up the update
        if: matrix.share == 1 && github.ref == 'refs/heads/main'
        run: |
          sed -i "s/inkwell-v[0-9]*/inkwell-${GITHUB_SHA::8}/" dist/sw.js
          touch dist/.nojekyll
      - if: matrix.share == 1 && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: matrix.share == 1 && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # The same build also goes to Cloudflare (the backup address) after Pages.
      - if: matrix.share == 1 && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 3

  publish:
    # Only once every share has passed, and only from main.
    name: Publish
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  cloudflare:
    # The backup address, https://inkwell.laserbunny.workers.dev : the same build,
    # right after GitHub Pages, so the app stays up if GitHub ever goes away.
    name: Publish to Cloudflare
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare is set up here
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::CLOUDFLARE_API_TOKEN not set in this repository yet; Cloudflare not updated."; fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the inkwell Worker
        if: steps.ready.outputs.ok == 'true'
        working-directory: site
        run: |
          rm -f dist/.nojekyll
          printf '{\n  "name": "inkwell",\n  "compatibility_date": "2026-10-01",\n  "assets": { "directory": "./dist" }\n}\n' > wrangler.jsonc
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@latest deploy
