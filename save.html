<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Save to Inkwell</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <meta name="theme-color" content="#1C1A17">
  <style>
    :root { --bg: #FBF8F2; --ink: #2A2621; --soft: #7A7064; --tick: #3F7D4E; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1C1A17; --ink: #EDE6DA; --soft: #A3998B; --tick: #7FC08F; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { display: flex; flex-direction: column; justify-content: center; gap: 4px; height: 100%; padding: 0 22px; box-sizing: border-box; }
    #sv-said { font-weight: 600; font-size: 16px; }
    #sv-said.done::before { content: "✓ "; color: var(--tick); }
    #sv-what { color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <main role="status">
    <div id="sv-said">Saving…</div>
    <div id="sv-what"></div>
  </main>
  <script type="module" src="./src/savepage.js"></script>
</body>
</html>
